<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEV Campo</title>
<style>
/* Layout: una columna tipo libreta de campo; barra superior fija, contenido en tarjetas, acciones grandes para usar con el pulgar */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#18211E; --muted:#5E6B66; --line:#D6DDD9;
  --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --danger:#B42318; --danger-soft:#FDE7E5;
  --s1:#2F6FDB; --s2:#D85A30; --s3:#1D9E75; --s4:#7F3FBF; --s5:#B7791F; --s6:#C2417A;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#18201D; --ink:#E4EAE7; --muted:#97A49F; --line:#2C3833;
  --accent:#43BFA3; --accent-ink:#06231D; --accent-soft:#16352E;
  --warn:#F0B44C; --warn-soft:#3A2C12; --danger:#F08A80; --danger-soft:#3D1A17;
  --s1:#6FA0F0; --s2:#F08A62; --s3:#4CC59A; --s4:#B188E8; --s5:#E2AE55; --s6:#E57AA6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201D; --ink:#E4EAE7; --muted:#97A49F; --line:#2C3833;
  --accent:#43BFA3; --accent-ink:#06231D; --accent-soft:#16352E;
  --warn:#F0B44C; --warn-soft:#3A2C12; --danger:#F08A80; --danger-soft:#3D1A17;
  --s1:#6FA0F0; --s2:#F08A62; --s3:#4CC59A; --s4:#B188E8; --s5:#E2AE55; --s6:#E57AA6;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:18px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
main{max-width:640px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;
  border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{min-width:44px;min-height:44px;padding:8px;font-size:22px;line-height:1}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%}
input.big{font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;font:inherit}
.item:last-child{border-bottom:0}
.item .n{width:28px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.item .main{flex:1;min-width:0}
.item .main b{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.item .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;vertical-align:middle}
.chip.emp{background:var(--accent-soft);color:var(--accent)}
.chip.ej{background:var(--warn-soft);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.result{text-align:center;padding:18px 14px;border-radius:14px;background:var(--accent-soft)}
.result .lab{font-size:14px;font-weight:600;color:var(--muted)}
.result .num{font-size:44px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.result .unit{font-size:18px;font-weight:600;color:var(--muted);font-family:var(--font)}
.result .k{font-size:13px;color:var(--muted);margin-top:4px}
.note{border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hdr h2{font-size:20px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
svg text{font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
textarea{font-family:var(--mono);font-size:12px;min-height:140px;white-space:pre}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,-8px)}}}
details.ayuda{background:var(--accent-soft);border-radius:12px;padding:0 14px;font-size:14px}
details.ayuda>summary{cursor:pointer;font-weight:650;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.ayuda>summary::-webkit-details-marker{display:none}
details.ayuda>summary::before{content:"?";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;flex:none}
details.ayuda[open]>summary{border-bottom:1px solid var(--line)}
details.ayuda>div{padding:10px 0 12px}
details.ayuda ol,details.ayuda ul{margin:6px 0;padding-left:20px}
details.ayuda li{margin:4px 0}
details.ayuda p{margin:6px 0}
details.opc{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.opc>summary{cursor:pointer;font-weight:600;padding:12px 0}
details.opc>div{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.tabla-wrap{overflow-x:auto;margin:0 -4px}
table.lay{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.lay th{font-weight:650;color:var(--muted);text-align:center;padding:6px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
table.lay td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:center;font-family:var(--mono)}
table.lay tr.sel td{background:var(--accent-soft)}
table.lay td.n button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:34px;min-height:36px;font:inherit;font-weight:700;cursor:pointer}
table.lay tr.sel td.n button{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table.lay input{min-height:38px;padding:6px 6px;text-align:right;font-family:var(--mono);font-size:14px;min-width:62px}
table.lay input.fijo{border:2px solid var(--accent);background:var(--accent-soft)}
table.lay .lock{display:block;font:600 10px var(--font);color:var(--accent);letter-spacing:.04em}
table.datos{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.datos th,table.datos td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
table.datos th{color:var(--muted);font-weight:600}
.btn.sm{min-height:40px;padding:6px 10px;font-size:14px;flex:1 1 90px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--bg)}
pre.plantilla{font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:0;white-space:pre}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
input[type=file]{padding:10px;min-height:0}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* Motor 1D para SEV Schlumberger: curva teórica (MN finito) + inversión tipo IPI2Win.
   Modelo: rho[0..N-1] (Ω·m), h[0..N-2] (m); la última capa es el semiespacio. */
const SEV = (() => {
  // J0 de Bessel (aprox. racional, Numerical Recipes; error ~1e-8)
  function J0(x){const ax=Math.abs(x);
    if(ax<8){const y=x*x;
      const a1=57568490574.0+y*(-13362590354.0+y*(651619640.7+y*(-11214424.18+y*(77392.33017+y*(-184.9052456)))));
      const a2=57568490411.0+y*(1029532985.0+y*(9494680.718+y*(59272.64853+y*(267.8532712+y))));
      return a1/a2}
    const z=8/ax,y=z*z,xx=ax-0.785398164;
    const a1=1+y*(-0.1098628627e-2+y*(0.2734510407e-4+y*(-0.2073370639e-5+y*0.2093887211e-6)));
    const a2=-0.1562499995e-1+y*(0.1430488765e-3+y*(-0.6911147651e-5+y*(0.7621095161e-6-y*0.934935152e-7)));
    return Math.sqrt(0.636619772/ax)*(Math.cos(xx)*a1-z*Math.sin(xx)*a2)}
  const CUT=10; // el resto del integrando decae como exp(-2·λ·z2); se corta en e^-24

  /* Parte de 2 capas (ρ1, ρ2, h1) por el método de imágenes, exacta:
     ∫(T2(λ)-ρ1) J0(λr) dλ = Σ 2ρ1 k^n / sqrt(r²+(2n h1)²),  k=(ρ2-ρ1)/(ρ2+ρ1). */
  /* Diferencia de la parte de 2 capas entre r=s-a y r=s+a, sumada término a término
     (así no se pierde precisión cuando ρ1 es muy grande frente a ρa). La cola se estima:
     alternante (k<0) con la regla del punto medio; monótona (k>0) con su forma asintótica ~1/n³. */
  function D2(ra,rb,r1,r2,h1){const k=(r2-r1)/(r2+r1);if(k===0)return 0;
    const N=Math.min(20000,Math.max(50,Math.ceil(5*rb/h1)));
    const f=n=>1/Math.hypot(ra,2*n*h1)-1/Math.hypot(rb,2*n*h1);
    let s=0,kn=1;
    for(let n=1;n<=N;n++){kn*=k;s+=kn*f(n);if(Math.abs(kn)<1e-15)return 2*r1*s}
    const M=N+0.5,ak=Math.abs(k),gM=Math.pow(ak,M)*f(M);
    if(k<0)s+=((N+1)%2?-1:1)*gM/2;
    else{const c=(rb*rb-ra*ra)/(2*Math.pow(2*h1,3));s+=c*Math.pow(k,M)/(M*M*(2+Math.abs(Math.log(k))*M))}
    return 2*r1*s}

  /* D = ∫0^∞ (T(λ)-ρ1)·[J0(λ(s-a)) - J0(λ(s+a))] dλ   (diferencia de potencial entre M y N).
     La parte de 2 capas es exacta (imágenes); el resto (T-T2), que decae con la profundidad
     de la 2ª interfaz, se integra con Simpson sobre UNA sola malla de λ para que los errores
     de las dos distancias se cancelen. T(λ) por la recurrencia de Pekeris. */
  function D(s,a,rho,h){
    const N=rho.length,r1=rho[0],r2=rho[1],h1=h[0];
    let out=D2(s-a,s+a,r1,r2,h1);
    if(N===2)return out;
    let zmax=0;for(const x of h)zmax+=x;const z2=h[0]+h[1];
    if(!(zmax>0)||!isFinite(zmax))return NaN;
    const zeff=Math.min(zmax,2*(s+a)); // capas mucho más profundas que AB no cambian la diferencia M-N
    const dl=Math.min(2*Math.PI/(s+a)/16,1/(2*zeff)/4);
    let n=Math.ceil(CUT/z2/dl);n=Math.min(Math.max(n,64),16000);if(n%2)n++;
    const q=new Float64Array(N-1),e=new Float64Array(N-1);
    for(let i=0;i<N-1;i++){q[i]=Math.exp(-2*h[i]*dl);e[i]=1}
    let sum=0;const ra=s-a,rb=s+a;
    for(let k=0;k<=n;k++){
      let T=rho[N-1];
      for(let i=N-2;i>=1;i--){const ex=e[i],th=(1-ex)/(1+ex),p=rho[i];T=(T+p*th)/(1+T*th/p)}
      const e0=e[0],th0=(1-e0)/(1+e0);
      const T1=(T+r1*th0)/(1+T*th0/r1),T2=(r2+r1*th0)/(1+r2*th0/r1);
      for(let i=0;i<N-1;i++)e[i]*=q[i];
      const l=k*dl,f=(T1-T2)*(J0(l*ra)-J0(l*rb));
      sum+=(k===0||k===n)?f:(k%2?4*f:2*f)}
    return out+sum*dl/3}

  /** ρa teórica para Schlumberger con AB/2 = s y MN (finito). */
  function rhoa(s,mn,rho,h){
    if(rho.length===1)return rho[0];
    const a=mn/2; if(!(s>a))return NaN;
    const K=Math.PI*(s*s-a*a)/(2*a);
    return rho[0]+(K/Math.PI)*D(s,a,rho,h)}

  /** Solución exacta de 2 capas por imágenes (para verificar). */
  function rhoa2exact(s,mn,r1,r2,h1){
    const a=mn/2,k=(r2-r1)/(r2+r1),K=Math.PI*(s*s-a*a)/(2*a);
    let sum=1/(s-a)-1/(s+a);
    for(let n=1;n<200000;n++){const t=2*Math.pow(k,n)*(1/Math.hypot(s-a,2*n*h1)-1/Math.hypot(s+a,2*n*h1));sum+=t;if(Math.abs(t)<1e-14*Math.abs(sum)&&n>5)break}
    return K/Math.PI*r1*sum}

  function forward(data,m){return data.map(d=>rhoa(d.ab,d.mn,m.rho,m.h))}
  /** Error de ajuste como IPI2Win: diferencia relativa RMS en %. */
  function rms(obs,cal){let s=0;for(let i=0;i<obs.length;i++){const e=(cal[i]-obs[i])/obs[i];s+=e*e}return 100*Math.sqrt(s/obs.length)}

  const LIM={rmin:0.1,rmax:1e5,hmin:0.1,hmax:2000};
  const toP=m=>[...m.rho.map(Math.log),...m.h.map(Math.log)];
  function fromP(p,N){const rho=p.slice(0,N).map(x=>Math.min(LIM.rmax,Math.max(LIM.rmin,Math.exp(x))));
    const h=p.slice(N).map(x=>Math.min(LIM.hmax,Math.max(LIM.hmin,Math.exp(x))));return{rho,h}}
  function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
    for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
      const v=M[c][c];if(Math.abs(v)<1e-30)return null;for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/v;if(f)for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}}
    return M.map((r,i)=>r[n]/r[i])}

  /** Inversión con número de capas fijo (Newton amortiguado / Levenberg-Marquardt en log).
      fix: arreglo de booleanos sobre [ρ1..ρN, h1..hN-1]. Devuelve {model, rms, iters}. */
  async function invert(data,m0,opt={}){
    const N=m0.rho.length,fix=opt.fix||[],maxIt=opt.maxIt??30,yieldEvery=opt.onIter;
    const obs=data.map(d=>Math.log(d.rho)),nd=obs.length;
    // Regularización suave (Tikhonov): empuja levemente las resistividades hacia el promedio de la curva,
    // para que entre modelos equivalentes se prefieran valores razonables y no extremos.
    const alpha=opt.alpha??0.0001,ref=obs.reduce((a,b)=>a+b,0)/nd,sa=Math.sqrt(alpha*nd);
    const resid=(cq,pp)=>{const r=obs.map((o,i)=>o-Math.log(cq[i]));for(let i=0;i<N;i++)r.push(sa*(ref-pp[i]));return r};
    let p=toP(m0),cal=forward(data,fromP(p,N)),r=resid(cal,p),phi=r.reduce((s,x)=>s+x*x,0);
    const free=p.map((_,i)=>!fix[i]).map((f,i)=>f?i:-1).filter(i=>i>=0);
    let mu=0.05,it=0;
    for(;it<maxIt&&free.length;it++){
      const Jm=r.map(()=>new Array(free.length).fill(0));
      for(let c=0;c<free.length;c++){const q=p.slice();q[free[c]]+=0.02;const cq=forward(data,fromP(q,N));
        for(let i=0;i<nd;i++)Jm[i][c]=(Math.log(cq[i])-Math.log(cal[i]))/0.02;
        if(free[c]<N)Jm[nd+free[c]][c]=sa}
      const JtJ=free.map((_,a)=>free.map((_,b)=>Jm.reduce((s,row)=>s+row[a]*row[b],0)));
      const Jtr=free.map((_,a)=>Jm.reduce((s,row,i)=>s+row[a]*r[i],0));
      let improved=false;
      for(let tries=0;tries<8;tries++){
        const A=JtJ.map((row,a)=>row.map((v,b)=>a===b?v*(1+mu)+1e-6:v));
        const dp=solve(A,Jtr);if(!dp||dp.some(x=>!isFinite(x))){mu*=10;continue}
        const q=p.slice();free.forEach((idx,c)=>{q[idx]+=Math.max(-1.5,Math.min(1.5,dp[c]))});
        const mq=fromP(q,N),qq=toP(mq),cq=forward(data,mq);if(cq.some(x=>!(x>0))){mu*=4;continue}
        const rq=resid(cq,qq),pq=rq.reduce((s,x)=>s+x*x,0);
        if(isFinite(pq)&&pq<phi){const rel=(phi-pq)/phi;p=qq;cal=cq;r=rq;phi=pq;mu=Math.max(mu/3,1e-5);improved=true;if(rel<1e-5)it=maxIt;break}
        mu*=4}
      if(yieldEvery)await yieldEvery(it,rms(data.map(d=>d.rho),cal));
      if(!improved)break}
    const model=fromP(p,N);return{model,rms:rms(data.map(d=>d.rho),cal),iters:it,cal}}

  /** Modelo inicial de N capas a partir de la curva (profundidades en progresión geométrica). */
  function startModel(data,N){
    const s=data.map(d=>d.ab),sMin=Math.min(...s),sMax=Math.max(...s);
    const zTop=Math.max(LIM.hmin*2,sMin*0.5),zBot=sMax*0.4;
    const depths=[];for(let i=1;i<N;i++)depths.push(zTop*Math.pow(zBot/zTop,(i-1)/Math.max(1,N-2)));
    if(N===2)depths[0]=Math.sqrt(zTop*zBot);
    const near=z=>{let best=data[0],bd=Infinity;for(const d of data){const v=Math.abs(Math.log(d.ab/(2.5*z)));if(v<bd){bd=v;best=d}}return best.rho};
    const rho=[];for(let i=0;i<N;i++){const zTopL=i?depths[i-1]:depths[0]/2,zB=i<N-1?depths[i]:zTopL*3;rho.push(near(Math.sqrt(zTopL*zB)))}
    rho[0]=data.reduce((a,d)=>d.ab<a.ab?d:a).rho; rho[N-1]=data.reduce((a,d)=>d.ab>a.ab?d:a).rho;
    const h=depths.map((z,i)=>z-(i?depths[i-1]:0));return{rho,h}}

  /** Modelo automático (como F7 de IPI2Win): el menor número de capas con buen ajuste. */
  async function auto(data,opt={}){
    const maxN=Math.min(opt.maxN??5,Math.floor((data.length+1)/2)),res=[];
    for(let N=2;N<=maxN;N++){
      const tries=[startModel(data,N)];
      if(N>2&&res.length){const prev=res[res.length-1].model;
        // dividir cada capa del mejor modelo anterior (como Ctrl+N en IPI2Win) y probar cuál ajusta mejor
        for(let k=0;k<prev.rho.length;k++){
          const rho=prev.rho.slice(),h=prev.h.slice();
          if(k<h.length){const hk=h[k];h.splice(k,1,hk*0.4,hk*0.6)}else{let z=0;for(const x of h)z+=x;h.push(Math.max(z*0.8,LIM.hmin*2))}
          const nb=k+1<rho.length?rho[k+1]:rho[k-1]||rho[k],f=nb>rho[k]?3:1/3;const r2=rho.slice();r2.splice(k+1,0,rho[k]*f);tries.push({rho:r2,h:h.slice()})}}
      let best=null;
      for(const t of tries){const r=await invert(data,t,{maxIt:10,onIter:opt.onIter&&((i,e)=>opt.onIter(N,i,e))});if(!best||r.rms<best.rms)best=r}
      best=await invert(data,best.model,{maxIt:40,onIter:opt.onIter&&((i,e)=>opt.onIter(N,i,e))});
      res.push(best);if(opt.onModel)opt.onModel(N,best.rms);
      if(best.rms<(opt.minErr??2))break
      if(res.length>=3){const a=res[res.length-2].rms,b=best.rms;if((a-b)/a<0.03&&(res[res.length-3].rms-a)/res[res.length-3].rms<0.03)break}}
    // Igual que IPI2Win: el menor número de capas que ajuste casi tan bien como el mejor.
    // Se descartan modelos con valores pegados a los límites (capas de 0,1 m o resistividades extremas).
    const raro=m=>{if(m.rho.some(x=>x<0.3||x>3e4))return true;let z=0;for(const x of m.h){if(x<Math.max(LIM.hmin*1.5,0.05*z)||x>=LIM.hmax*0.95)return true;z+=x}return false};
    const ok=res.filter(r=>!raro(r.model)),pool=ok.length?ok:res;
    const minR=Math.min(...pool.map(r=>r.rms)),tol=Math.max(opt.minErr??2,minR*1.2,minR+1);
    const pick=pool.find(r=>r.rms<=tol)||pool[pool.length-1];
    return{...pick,todos:res.map(r=>({N:r.model.rho.length,rms:r.rms,raro:raro(r.model)}))}}

  /** Rango de equivalencia de un parámetro (como Model→Maximum/Minimum):
      se mueve el parámetro y se reajustan los demás mientras el error no suba más de tol %. */
  async function equivalence(data,model,idx,opt={}){
    const N=model.rho.length,base=await invert(data,model,{maxIt:20}),lim=Math.max(base.rms*(1+(opt.tol??0.1)),base.rms+1);
    const p0=toP(base.model),out={};
    for(const dir of [-1,1]){let last=Math.exp(p0[idx]),m=fromP(p0,N);
      for(let k=1;k<=(opt.steps??24);k++){const p=toP(m);p[idx]=p0[idx]+dir*k*Math.log(1.12);
        const fix=[];fix[idx]=true;const r=await invert(data,fromP(p,N),{fix,maxIt:12});
        if(opt.onStep)await opt.onStep();
        if(r.rms>lim)break;last=Math.exp(p[idx]);m=r.model;if(last<=LIM.rmin*1.01||last>=LIM.rmax*0.99)break}
      out[dir<0?'min':'max']=last}
    return{...out,valor:Math.exp(p0[idx]),rms:base.rms,limite:lim}}

  return{rhoa,rhoa2exact,forward,rms,invert,auto,startModel,equivalence,LIM}})();

function K(ab,mn){ab=num(ab);mn=num(mn);if(!ab||!mn||mn<=0||ab<=mn/2)return null;return Math.PI*(ab*ab-(mn/2)**2)/mn}
/** ΔV útil (sin potencial natural). Con SP: |ΔV − SP|. Con signos opuestos: |ΔV1 − ΔV2| / 2. */
function dvProm(f){const a=num(f.dv1),b=num(f.dv2),sp=num(f.sp);
  if(sp!=null){const v=[a,b].filter(x=>x!=null).map(x=>Math.abs(x-sp));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
  if(a!=null&&b!=null&&(a<0)!==(b<0))return Math.abs(a-b)/2;
  const v=[a,b].filter(x=>x!=null).map(Math.abs);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function rho(s,f){
  if(s.modo==='rho'){const p=num(f.rhoa);return p!=null&&p>0&&num(f.ab)>0?p:null}
  const k=Ks(s,f);if(k==null)return null;
  if(s.modo==='r'){const r=num(f.r);return r==null?null:k*Math.abs(r)}
  const i=num(f.i),dv=dvProm(f);if(i==null||i===0||dv==null)return null;return k*dv/Math.abs(i)}
function isEmpalme(s,idx){const f=s.filas[idx];if(!f)return false;return s.filas.some((g,j)=>j!==idx&&num(g.ab)===num(f.ab)&&num(g.mn)!==num(f.mn))}

/* ---------- equipo digital (Módulo 2, red SEV-Campo) ---------- */
function eqBase(){try{const v=localStorage.getItem('sev-eq-base');if(v)return v}catch(e){}return location.hostname==='192.168.4.1'?'':'http://192.168.4.1'}
async function leerEquipo(){

  let est;
  try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),4000);const r=await fetch(eqBase()+'/api',{cache:'no-store',signal:c.signal});clearTimeout(tm);est=await r.json()}

  if(!ps.length){toast('El equipo todavía no tiene lecturas. Aprieta S1 unos 3 segundos y vuelve a tocar el botón.');return}
  const pos=ps.filter(p=>p.dv>0),neg=ps.filter(p=>p.dv<0),sum=(a,g)=>a.reduce((x,p)=>x+g(p),0),r5=x=>+x.toPrecision(5);

  else if(s.modo==='r')f.r=r5(R);
  else{const k=Ks(s,f);if(k==null){toast('Escribe AB/2 y MN antes de leer.');return}f.rhoa=r5(k*R)}
  if(!f.nota)f.nota='equipo digital';
  const av=[];if(!pos.length||!neg.length)av.push('falta la lectura '+(pos.length?'invertida (S2 en 2)':'normal (S2 en 1)'));
  if(pos.length&&neg.length){const Rp=sum(pos,p=>p.dv)/sum(pos,p=>Math.abs(p.i)),Rn=sum(neg,p=>-p.dv)/sum(neg,p=>Math.abs(p.i)),d=Math.abs(Rp-Rn)/R*100;if(d>5)av.push(`las dos polaridades difieren ${fmt(d,0)} %`)}
  if(ps.some(p=>p.ruido!=null&&p.ruido>0.05*Math.abs(p.dv)))av.push('hubo lecturas inestables');

function empMsg(s,i){const f=s.filas[i];const otro=s.filas.find((g,j)=>j!==i&&num(g.ab)===num(f.ab));

/** Señal baja: con menos de 5 mV entre M y N el ruido pesa mucho. Lo más eficaz es ampliar MN (empalme). */
const SENAL_MIN=5;
function mnSugerido(ab,mn){const st=[1,2,5,10,20,40],c=st.filter(v=>v>mn&&v<=0.2*ab),c2=st.filter(v=>v>mn&&v<=0.4*ab);return c.length?c[c.length-1]:c2.length?c2[0]:null}

/* ---------- curva ---------- */
function mnColors(s){const m=new Map();for(const f of s.filas){const v=num(f.mn);if(v!=null&&!m.has(v))m.set(v,COLORS[m.size%COLORS.length])}return m}
function niceLo(v){const e=Math.floor(Math.log10(v)),b=10**e;for(const m of [5,2,1])if(m*b<=v)return m*b;return b}
function niceHi(v){const e=Math.floor(Math.log10(v)),b=10**e;for(const m of [1,2,5,10])if(m*b>=v)return m*b;return 10*b}
const ticksLog=(a,b)=>{const out=[];for(let e=Math.floor(Math.log10(a));e<=Math.ceil(Math.log10(b));e++)for(let m=1;m<=9;m++){const v=m*10**e;if(v>=a*0.999&&v<=b*1.001)out.push({v,m})}return out};
const labLog=v=>v>=1000?(+(v/1000).toPrecision(3))+'k':String(+v.toPrecision(3)).replace('.',',');
/** Datos comunes para dibujar la curva (pantalla y PDF). */

    const n=Math.max(2,Math.ceil(10*Math.log10(hi/lo))+1),pp=[];for(let k=0;k<n;k++){const sab=lo*Math.pow(hi/lo,k/(n-1)),v=SEV.rhoa(sab,mn,M.rho,M.h);if(v>0)pp.push([sab,v])}teo.push(pp)}return teo}
function curvaDatos(s,M,I){
  const pts=s.filas.map((f,i)=>({i,ab:num(f.ab),mn:num(f.mn),p:rho(s,f),off:!!f.off})).filter(o=>o.ab>0&&o.p>0);
  if(!pts.length)return null;
  const xs=pts.map(o=>o.ab),ys=pts.map(o=>o.p),zs=M?espesores(M):[],zsI=I?espesores(I):[];
  const yLo=Math.min(...ys),yHi=Math.max(...ys);
  for(const m of [M,I])if(m){for(const r of m.rho)ys.push(Math.min(yHi*30,Math.max(yLo/30,r)));for(const z of espesores(m))xs.push(z)}
  let x0=niceLo(Math.min(...xs)),x1=niceHi(Math.max(...xs)),y0=niceLo(Math.min(...ys)),y1=niceHi(Math.max(...ys));
  if(x1/x0<10)x1=x0*10;if(y1/y0<10){y0=niceLo(y0/2);y1=niceHi(y1*2)}

  for(const g of groups.values())g.sort((a,b)=>a.ab-b.ab);

  const W=360,H=310,L=44,R=12,T=26,B=40,w=W-L-R,h=H-T-B;
  const X=v=>L+w*Math.log10(v/x0)/Math.log10(x1/x0),Y=v=>T+h-h*Math.log10(Math.min(y1,Math.max(y0,v))/y0)/Math.log10(y1/y0);

    if([1,2,3,4,5,6,8].includes(t.m)){const sl=labLog(t.v),wd=sl.length*6.2;if(x-wd/2>lastX+3){labsX.push(`<text x="${x}" y="${T+h+15}" font-size="10.5" text-anchor="middle" fill="var(--${t.m===1?'ink':'muted'})">${sl}</text>`);lastX=x+wd/2}}}
  for(const t of ticksLog(y0,y1)){const y=Y(t.v);lines.push(`<line x1="${L}" x2="${L+w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${t.m===1?1.2:.5}"/>`);

    for(const pp of teoI)if(pp.length>1)modelo+=`<polyline points="${pp.map(([a,v])=>X(a).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 3"/>`}
  if(M){let d=`M${L} ${Y(M.rho[0]).toFixed(1)}`;zs.forEach((z,i)=>{d+=` H${Math.min(L+w,X(z)).toFixed(1)} V${Y(M.rho[i+1]).toFixed(1)}`});d+=` H${L+w}`;
    modelo+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6" opacity=".55"/>`;
    for(const pp of teo)if(pp.length>1)modelo+=`<polyline points="${pp.map(([a,v])=>X(a).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--danger)" stroke-width="2.2" stroke-linejoin="round"/>`}
  for(const [mn,g] of groups){const c=`var(${cols.get(mn)||'--s1'})`;
    if(g.length>1&&!M)segs+=`<polyline points="${g.map(o=>X(o.ab).toFixed(1)+','+Y(o.p).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    for(const o of g)dots+=`<circle cx="${X(o.ab).toFixed(1)}" cy="${Y(o.p).toFixed(1)}" r="${M?3.6:4}" fill="${M?'var(--surface)':c}" stroke="${c}" stroke-width="${M?2:0}"/><circle cx="${X(o.ab).toFixed(1)}" cy="${Y(o.p).toFixed(1)}" r="12" fill="transparent" data-a="pt" data-i="${o.i}" style="cursor:pointer"/>`}
  let offDots='';for(const o of (C.offPts||[])){const x=+X(o.ab).toFixed(1),y=+Y(o.p).toFixed(1);offDots+=`<line x1="${(x-3.5).toFixed(1)}" y1="${(y-3.5).toFixed(1)}" x2="${(x+3.5).toFixed(1)}" y2="${(y+3.5).toFixed(1)}" stroke="var(--muted)" stroke-width="1.6"/><line x1="${(x-3.5).toFixed(1)}" y1="${(y+3.5).toFixed(1)}" x2="${(x+3.5).toFixed(1)}" y2="${(y-3.5).toFixed(1)}" stroke="var(--muted)" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="12" fill="transparent" data-a="pt" data-i="${o.i}" style="cursor:pointer"/>`}
  const leg=[...groups.keys()].map(mn=>`<span><i class="dot" style="background:var(${cols.get(mn)||'--s1'})"></i>${mn?'MN '+fmtg(mn)+' m':'Datos'}</span>`).join('')+
    ((C.offPts&&C.offPts.length)?`<span><i class="dot" style="background:var(--muted)"></i>Sin usar (✕)</span>`:'')+
    (M?`<span><i class="dot" style="background:var(--danger)"></i>Modelo de la app</span><span><i class="dot" style="background:var(--ink);opacity:.55"></i>Capas</span>`:'')+(I?`<span><i class="dot" style="background:var(--warn)"></i>IPI2Win (punteado)</span>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva de resistividad aparente contra AB/2, escala logarítmica">
  <rect x="${L}" y="${T}" width="${w}" height="${h}" fill="var(--surface)" stroke="var(--muted)" stroke-width="1"/>
  ${lines.join('')}${labsX.join('')}${labsY.join('')}
  <text x="${L+w/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="var(--muted)">${M?'AB/2 y profundidad (m)':'AB/2 (m)'}</text>
  <text x="4" y="13" font-size="12" fill="var(--muted)">ρa (Ω·m)</text>
  ${modelo}${segs}${offDots}${dots}</svg><div class="legend">${leg}</div>`}

/* ---------- capas: interpretación tipo IPI2Win ---------- */
function datosInv(s){return s.filas.filter(f=>!f.off).map(f=>({ab:num(f.ab),mn:num(f.mn)||Math.max(0.01,num(f.ab)/10),rho:rho(s,f)})).filter(d=>d.ab>0&&d.rho>0&&d.ab>d.mn/2)}
function material(r){
  if(r<1)return'Agua salada o arcilla muy salina';if(r<10)return'Arcilla, o arena con agua salobre';
  if(r<30)return'Arcilla arenosa o limo húmedo';if(r<100)return'Arena o grava con agua dulce';
  if(r<300)return'Arena o grava gruesa, roca muy fracturada';if(r<1000)return'Grava o arena seca, roca fracturada';
  return'Roca sana o material muy seco'}
let BUSY=false;const UNDO={},RESTORE={};
function pushUndo(s){if(!s.modelo)return;(UNDO[s.id]=UNDO[s.id]||[]).push(clone(s.modelo));if(UNDO[s.id].length>40)UNDO[s.id].shift()}
function fixArr(M){const N=M.rho.length,f=[];for(let i=0;i<N;i++)f[i]=!!M.fixR[i];for(let i=0;i<N-1;i++)f[N+i]=!!M.fixH[i];return f}
function setModel(s,m,old){const N=m.rho.length,keep=old&&old.rho.length===N;
  s.modelo={rho:m.rho.slice(),h:m.h.slice(),fixR:Array.from({length:N},(_,i)=>!!(keep&&old.fixR[i])),fixH:Array.from({length:N-1},(_,i)=>!!(keep&&old.fixH[i]))};
  if(!RESTORE[s.id])RESTORE[s.id]=clone(s.modelo);if(V.sel>=N)V.sel=N-1}
function altTxt(s,d){return fmt((num(s.alt)||0)-d,2)}

function vCapas(s){
  const d=datosInv(s);
  const help=ayuda(`<p>Funciona como IPI2Win. La <b>línea roja</b> es la curva que daría el modelo; los <b>escalones</b> son las capas (profundidad en el eje horizontal, ρ en el vertical); los <b>puntos</b> son tus datos.</p>
   <ol><li><b>Automático</b> (<span class="kbd">F7</span>): busca el menor número de capas que ajuste bien. Empieza siempre por aquí.</li>
   <li>Toca el número de una capa en la tabla para seleccionarla. Con la capa seleccionada puedes <b>Dividir</b> (<span class="kbd">Ctrl</span>+<span class="kbd">N</span>), <b>Unir con la siguiente</b> (<span class="kbd">Ctrl</span>+<span class="kbd">Y</span>), <b>Fijar</b> su ρ o su espesor si los conoces (por un pozo), y ver su <b>Mínimo / Máximo</b> por equivalencia.</li>
   <li>Puedes escribir ρ y h a mano en la tabla. Luego toca <b>Ajustar</b> (<span class="kbd">Espacio</span>): mueve los valores sin cambiar el número de capas.</li>
   <li>Mira el <b>RMS</b>: menos de 5 % es buen ajuste. Entre dos modelos con error parecido, quédate con el de menos capas.</li>
   <li><b>Deshacer</b> (<span class="kbd">Alt</span>+<span class="kbd">Retroceso</span>) vuelve un paso; <b>Restaurar</b> (<span class="kbd">Ctrl</span>+<span class="kbd">F7</span>) vuelve al primer modelo de esta sesión.</li></ol>
   <p>Columnas: <b>ρ</b> resistividad (Ω·m), <b>h</b> espesor (m), <b>d</b> profundidad de la base de la capa (m), <b>Alt</b> cota de esa base = altitud del sondeo − d. Las teclas funcionan en el PC.</p>`);
  if(d.length<4)return help+`<div class="note info">Para calcular capas hacen falta al menos 4 medidas con resistividad. Llevas ${d.length}.</div>`;
  const M=s.modelo;
  if(!M)return help+`<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>Todavía no hay modelo de capas</b>
    <button class="btn primary" data-a="auto" ${BUSY?'disabled':''}>Calcular capas automáticamente (F7)</button>

    <div id="inv" class="small muted" aria-live="polite"></div></section>`+ipiCard(s);
  const cal=SEV.forward(d,M),e=SEV.rms(d.map(x=>x.rho),cal),N=M.rho.length,zs=espesores(M),i=Math.min(V.sel,N-1);
  const cls=e<=5?'info':'warn',msg=e<=5?'Buen ajuste':e<=10?'Ajuste aceptable':'Ajuste pobre: revisa datos o número de capas';
  const filas=M.rho.map((r,k)=>`<tr class="${k===i?'sel':''}"><td class="n"><button data-a="sel" data-l="${k}" aria-label="Seleccionar capa ${k+1}">${k+1}</button></td>
    <td><input inputmode="decimal" class="${M.fixR[k]?'fijo':''}" data-l="${k}" data-k="rho" value="${sig(r,4)}" aria-label="Resistividad capa ${k+1}">${M.fixR[k]?'<span class="lock">FIJO</span>':''}</td>
    <td>${k<N-1?`<input inputmode="decimal" class="${M.fixH[k]?'fijo':''}" data-l="${k}" data-k="h" value="${sig(M.h[k],3)}" aria-label="Espesor capa ${k+1}">${M.fixH[k]?'<span class="lock">FIJO</span>':''}`:''}</td>
    <td>${k<N-1?fmt(zs[k],2):''}</td><td>${k<N-1?altTxt(s,zs[k]):''}</td></tr>`).join('');
  const top=i?zs[i-1]:0,eq=V.eq&&V.eq.sid===s.id&&V.eq.i===i?V.eq:null,dis=BUSY?'disabled':'';
  return help+`<section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="hdr"><b>Error de ajuste (RMS)</b><span id="rmsVal" style="font:700 24px var(--mono)">${fmt(e,2)} %</span></div>
    <div class="note ${cls} small">${msg} · ${N} capas</div>
    <div class="row"><button class="btn primary" data-a="invertir" ${dis}>Ajustar (Espacio)</button><button class="btn" data-a="auto" ${dis}>Automático (F7)</button></div>
    <div class="row"><button class="btn sm" data-a="deshacer" ${dis||(UNDO[s.id]&&UNDO[s.id].length?'':'disabled')}>Deshacer</button>
    <button class="btn sm" data-a="restaurar" ${dis}>Restaurar</button><button class="btn sm" data-a="copiar-modelo">Copiar modelo</button>
    ${pegarDisponible()?`<button class="btn sm" data-a="pegar" ${dis}>Pegar modelo</button>`:''}</div>
    <div id="inv" class="small muted" aria-live="polite"></div></section>
  <section class="card">${curva(s,{model:M,ipi:ipiValido(s)})}<div id="pt" class="small muted">Toca un punto para ver su valor.</div></section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="hdr"><b>Modelo de capas</b><span class="small muted">Altitud ${s.alt==null?'no indicada':fmt(num(s.alt),1)+' m'}</span></div>
    <div class="tabla-wrap"><table class="lay"><thead><tr><th>N</th><th>ρ (Ω·m)</th><th>h (m)</th><th>d (m)</th><th>Alt (m)</th></tr></thead><tbody>${filas}</tbody></table></div>
    <div class="card" style="background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:12px">
      <div class="hdr"><b>Capa ${i+1} seleccionada</b><span class="small muted">${i<N-1?`de ${fmt(top,2)} a ${fmt(zs[i],2)} m`:`desde ${fmt(top,2)} m hacia abajo`}</span></div>
      <div class="small">Posible: ${materialDe(s,M.rho[i])}</div>
      ${eq?`<div class="note info small">${eq.txt}</div>`:''}
      <div class="row" style="gap:8px">
        <button class="btn sm" data-a="dividir" ${dis}>Dividir</button>
        ${i<N-1?`<button class="btn sm" data-a="unir" ${dis||(N<3?'disabled':'')}>Unir con la siguiente</button>`:''}
        <button class="btn sm" data-a="fijar" data-k="rho">${M.fixR[i]?'Soltar ρ':'Fijar ρ'}</button>
        ${i<N-1?`<button class="btn sm" data-a="fijar" data-k="h">${M.fixH[i]?'Soltar h':'Fijar h'}</button>`:''}
        <button class="btn sm" data-a="rango" data-k="rho" ${dis}>Mín/Máx ρ</button>
        ${i<N-1?`<button class="btn sm" data-a="rango" data-k="h" ${dis}>Mín/Máx h</button>`:''}
      </div></div>
  </section>
  <details class="opc"><summary>Opciones del modo automático</summary><div>
    <div class="grid3"><label class="f">Error mínimo (%)<input inputmode="decimal" data-op="minErr" value="${fmtg(S.opciones.minErr)}"></label>
    <label class="f">Máx. de capas<input inputmode="numeric" data-op="maxN" value="${S.opciones.maxN}"></label>
    <label class="f">Tolerancia Mín/Máx (%)<input inputmode="decimal" data-op="tol" value="${fmtg(S.opciones.tol)}"></label></div>
    <p class="small muted" style="margin:0">El automático deja de agregar capas cuando el error baja del mínimo. "Tolerancia" es cuánto puede subir el error (en %) al calcular el mínimo y el máximo de una capa.</p></div></details>
  ${ipiCard(s)}
  <button class="btn ghost danger" data-a="borrarModelo">Borrar el modelo</button>
  <p class="small muted">El material es solo una guía: el mismo valor puede ser arcilla o arena con agua salobre. Confírmalo con un pozo o una excavación cercana.</p>`}
function ipiValido(s){const I=s.ipi;return I&&I.rho.length>=2&&I.h.length===I.rho.length-1&&I.rho.every(x=>x>0)&&I.h.every(x=>x>0)?I:null}
function ipiCard(s){
  const I=s.ipi||{rho:[],h:[],rms:null},N=I.rho.length,zs=espesores(I),d=datosInv(s),ok=ipiValido(s);
  const e=ok&&d.length?SEV.rms(d.map(x=>x.rho),SEV.forward(d,ok)):null;
  const filas=I.rho.map((r,k)=>`<tr><td>${k+1}</td><td><input inputmode="decimal" data-ipil="${k}" data-ipik="rho" value="${sig(r,4)}" aria-label="IPI2Win resistividad capa ${k+1}"></td>
    <td>${k<N-1?`<input inputmode="decimal" data-ipil="${k}" data-ipik="h" value="${sig(I.h[k],4)}" aria-label="IPI2Win espesor capa ${k+1}">`:''}</td>
    <td>${k<N-1&&isFinite(zs[k])?fmt(zs[k],2):''}</td><td>${k<N-1&&isFinite(zs[k])?altTxt(s,zs[k]):''}</td></tr>`).join('');
  return `<section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="hdr"><b>Resultado de IPI2Win</b><span class="small muted">opcional</span></div>
    ${ayuda(`<ol><li>Cuando interpretes este sondeo en IPI2Win, copia aquí su tabla de capas: <b>ρ</b> y <b>h</b> de cada capa (d y Alt se calculan solos) y el <b>RMS</b> que muestra el programa.</li>
      <li>También puedes <b>pegar la tabla</b> como texto (columnas N, ρ, h…), por ejemplo escribiéndola en el Bloc de notas.</li>
      <li>Ese modelo aparece <b>punteado</b> en la gráfica y en el <b>informe PDF</b>, comparado con el de la app.</li>
      <li><b>Usar en la app</b> lo pasa al modelo de la app para seguir ajustándolo aquí.</li></ol>`,'Cómo anotar el resultado de IPI2Win')}
    ${N?`<div class="tabla-wrap"><table class="lay"><thead><tr><th>N</th><th>ρ (Ω·m)</th><th>h (m)</th><th>d (m)</th><th>Alt (m)</th></tr></thead><tbody>${filas}</tbody></table></div>`:'<div class="small muted">Sin datos de IPI2Win todavía.</div>'}
    <div class="row"><button class="btn sm" data-a="ipiAdd">+ Capa</button><button class="btn sm" data-a="ipiDel" ${N?'':'disabled'}>− Quitar última</button>
      ${s.modelo?'<button class="btn sm" data-a="ipiDesdeApp">Copiar el de la app</button>':''}</div>
    <div class="grid2"><label class="f">RMS de IPI2Win (%)<input inputmode="decimal" data-ipirms="1" value="${fmtg(I.rms)}" placeholder="Ej: 5,71"></label>
      <div class="small" style="align-self:end;padding-bottom:12px">RMS calculado aquí: <b>${e==null?'—':fmt(e,2)+' %'}</b></div></div>
    <details class="opc"><summary>Pegar la tabla de IPI2Win</summary><div>
      <textarea id="ipiTxt" placeholder="N  ρ  h  d  Alt&#10;1  18.7  1.58  1.58  -1.577&#10;2  609  3.85  5.43  -5.425&#10;3  10  11  16.4  -16.43&#10;4  60" aria-label="Tabla de IPI2Win"></textarea>
      <button class="btn" data-a="ipiPegar">Leer tabla</button></div></details>
    ${ok?'<div class="row"><button class="btn sm" data-a="ipiUsar">Usar en la app</button><button class="btn sm danger" data-a="ipiBorrar">Borrar resultado IPI2Win</button></div>':''}
  </section>`}
function accionIpi(a){const s=cur();s.ipi=s.ipi||{rho:[],h:[],rms:null};const I=s.ipi;
  if(a==='ipiAdd'){if(!I.rho.length){I.rho=[50,100];I.h=[2]}else{const z=espesores(I);I.h.push(Math.max(1,(z[z.length-1]||2)));I.rho.push(I.rho[I.rho.length-1])}}
  else if(a==='ipiDel'){I.rho.pop();if(I.h.length>=I.rho.length)I.h.pop()}
  else if(a==='ipiDesdeApp'&&s.modelo){I.rho=s.modelo.rho.map(x=>+x.toPrecision(4));I.h=s.modelo.h.map(x=>+x.toPrecision(3))}
  else if(a==='ipiUsar'){const ok=ipiValido(s);if(!ok)return;pushUndo(s);setModel(s,{rho:ok.rho,h:ok.h});toast('Modelo de IPI2Win copiado al de la app')}
  else if(a==='ipiBorrar'){confirmar('¿Borrar el resultado de IPI2Win anotado?','Borrar',()=>{delete s.ipi;saveNow();render()});return}
  else if(a==='ipiPegar'){const r=leerTablaIPI($('#ipiTxt').value);if(!r){toast('No reconocí la tabla. Debe tener N, ρ y h por línea.');return}I.rho=r.rho;I.h=r.h;if(r.rms!=null)I.rms=r.rms;toast(`Leídas ${r.rho.length} capas de IPI2Win`)}
  saveNow();render()}
function leerTablaIPI(t){const rho=[],h=[];let rms=null;
  for(const l of String(t).split(/\r?\n/)){const m=l.match(/rms\s*=?\s*([\d.,]+)/i);if(m)rms=num(m[1]);
    const c=partir(l.trim());if(!c[0])continue;const n=c.map(num);if(n[0]==null||n[1]==null)continue;
    if(n.length>=3&&Number.isInteger(n[0])&&n[0]===rho.length+1){rho.push(n[1]);if(n[2]!=null)h.push(n[2])}
    else if(n.length===2&&Number.isInteger(n[0])&&n[0]===rho.length+1){rho.push(n[1])}
    else{rho.push(n[0]);if(n[1]!=null)h.push(n[1])}}
  if(rho.length<2)return null;if(h.length>rho.length-1)h.length=rho.length-1;if(h.length!==rho.length-1)return null;
  return{rho,h,rms}}
function pegarDisponible(){try{return !!localStorage.getItem(CLIP)}catch(e){return !!window.__clip}}
function setInv(t){const el=$('#inv');if(el)el.textContent=t}
const pausa=()=>new Promise(r=>setTimeout(r,0));
async function correr(fn){if(BUSY)return;BUSY=true;V.eq=null;V.eqKeep=null;render();
  try{await fn()}catch(e){toast('No se pudo calcular: '+e.message)}BUSY=false;V.eq=V.eqKeep;saveNow();render()}
async function accionCapas(a,t){
  const s=cur(),d=datosInv(s),M=s.modelo,i=V.sel;
  if(a==='auto')return correr(async()=>{pushUndo(s);setInv('Buscando el número de capas…');
    const r=await SEV.auto(d,{minErr:S.opciones.minErr,maxN:S.opciones.maxN,onIter:async(N,k,e)=>{setInv(`Probando ${N} capas… error ${fmt(e,1)} %`);await pausa()}});
    setModel(s,r.model);V.sel=0;toast(`Listo: ${r.model.rho.length} capas, error ${fmt(r.rms,2)} %`)});
  if(a==='dos')return correr(async()=>{setInv('Ajustando 2 capas…');const r=await SEV.invert(d,SEV.startModel(d,2),{maxIt:40});setModel(s,r.model)});
  if(!M)return;
  if(a==='invertir')return correr(async()=>{pushUndo(s);setInv('Ajustando…');
    const r=await SEV.invert(d,M,{fix:fixArr(M),maxIt:40,onIter:async(k,e)=>{setInv(`Iteración ${k+1}: error ${fmt(e,2)} %`);await pausa()}});
    setModel(s,r.model,M);toast(`Error ${fmt(r.rms,2)} %`)});
  if(a==='dividir'){pushUndo(s);const rho=M.rho.slice(),h=M.h.slice(),fr=M.fixR.slice(),fh=M.fixH.slice();
    if(i<h.length){const x=h[i];h.splice(i,1,x*0.4,x*0.6);fh.splice(i,1,false,false)}else{const z=h.reduce((a,b)=>a+b,0);h.push(Math.max(z,1));fh.push(false)}
    rho.splice(i+1,0,rho[i]);fr.splice(i+1,0,false);s.modelo={rho,h,fixR:fr,fixH:fh};saveNow();render();toast('Capa dividida. Ahora toca Ajustar.');return}
  if(a==='unir'){if(i>=M.rho.length-1||M.rho.length<3)return;pushUndo(s);const rho=M.rho.slice(),h=M.h.slice(),fr=M.fixR.slice(),fh=M.fixH.slice();
    if(i<h.length-1){const t1=h[i],t2=h[i+1];rho.splice(i,2,Math.exp((Math.log(rho[i])*t1+Math.log(rho[i+1])*t2)/(t1+t2)));h.splice(i,2,t1+t2);fh.splice(i,2,false)}
    else{rho.splice(i,2,rho[i]);h.splice(i,1);fh.splice(i,1)}
    fr.splice(i,2,false);s.modelo={rho,h,fixR:fr,fixH:fh};V.eq=null;saveNow();render();toast('Capas unidas. Ahora toca Ajustar.');return}
  if(a==='fijar'){const k=t.dataset.k;if(k==='rho')M.fixR[i]=!M.fixR[i];else M.fixH[i]=!M.fixH[i];saveNow();render();return}
  if(a==='deshacer'){const st=UNDO[s.id];if(st&&st.length){s.modelo=st.pop();V.eq=null;saveNow();render();toast('Deshecho')}return}
  if(a==='restaurar'){if(RESTORE[s.id]){pushUndo(s);s.modelo=clone(RESTORE[s.id]);V.eq=null;saveNow();render();toast('Modelo restaurado')}return}
  if(a==='rango'){const k=t.dataset.k,idx=k==='rho'?i:M.rho.length+i;
    return correr(async()=>{let n=0;setInv('Calculando mínimo y máximo…');

function datosPerfil(linea){

function rhoInterp(D,x,z,usaAlt){const c=D.col;let j=0;while(j<c.length-2&&x>c[j+1].x)j++;

function svgPerfil(D,usaAlt,modo){

  saveNow();go({view:'lista'});toast(n||c?`${n} estudio(s) agregados${c?`, ${c} completado(s) con su modelo y línea`:''}. Mira también Perfil 2D.`:'Los estudios ya estaban en la lista')}
/* ---------- arreglo semi-Schlumberger y pozos de referencia ---------- */
/* Semi-Schlumberger (polo-dipolo): B muy lejos y solo se abre A. Sobre capas horizontales da la misma ρa que el
   Schlumberger con AB/2 = L (distancia de A al centro de MN), así que la inversión no cambia; solo K se duplica. */
const ARREGLOS={schlum:'Schlumberger (A y B simétricos)',semi:'Semi-Schlumberger (B fijo muy lejos, solo se abre A)'};
const esSemi=s=>!!s&&s.arreglo==='semi';
function Ks(s,f){const k=K(f.ab,f.mn);return k==null?null:k*(esSemi(s)?2:1)}
function maxAB(s){return Math.max(0,...s.filas.map(f=>num(f.ab)||0))}
function avisoArreglo(s){if(!esSemi(s))return'';const L=maxAB(s),b=num(s.distB);
  if(!(b>0))return`<div class="note warn small"><b>Semi-Schlumberger:</b> anota en <b>Editar</b> la distancia del centro al electrodo B. Debe ser al menos 5 a 10 veces el AB/2 más abierto${L?` (aquí, ${fmtg(5*L)} m o más)`:''}.</div>`;
  if(L&&b<5*L)return`<div class="note warn small"><b>Semi-Schlumberger:</b> B está a ${fmtg(b)} m y A llega a ${fmtg(L)} m. B debería estar al menos a ${fmtg(5*L)} m (5 veces). Las lecturas largas pueden salir alteradas.</div>`;
  return`<div class="note info small">Arreglo <b>semi-Schlumberger</b>: B a ${fmtg(b)} m. K se calcula el doble que en el Schlumberger; en la columna AB/2 va la distancia de A al centro.</div>`}

/* ---- pozo de referencia junto al SEV ---- */
const pozoVacio=()=>({nombre:'',dist:null,fecha:'',prof:null,nivel:null,ec:null,caudal:null,notas:'',capas:[]});
const MATS=['Suelo / capa vegetal','Arcilla','Limo','Arena fina','Arena media a gruesa','Arena arcillosa','Grava','Grava con arena','Saprolito (roca meteorizada)','Roca fracturada','Roca sana','Caliza','Arenisca','Lutita'];
/** Resistividad del modelo en un tramo [de,a]: promedio logarítmico ponderado por espesor. */
function rhoTramo(M,de,a){if(!M||!(a>de))return null;const z=espesores(M);let sum=0,w=0,top=0;
  for(let i=0;i<M.rho.length;i++){const bot=i<z.length?z[i]:Infinity,o=Math.min(a,bot)-Math.max(de,top);if(o>0){sum+=o*Math.log(M.rho[i]);w+=o}top=bot}
  return w>0?Math.exp(sum/w):null}
const normMat=m=>(m||'').trim().toLowerCase().replace(/\s+/g,' ');
function tPozo(s){const P=s.pozo||pozoVacio(),M=s.modelo,rw=num(P.ec)>0?10000/num(P.ec):null;

    <li>La conductividad del agua (µS/cm, con un conductivímetro) dice si el agua es dulce o salobre: resistividad del agua = 10.000 ÷ conductividad.</li></ol>`);
  const filas=P.capas.map((c,k)=>{const r=M?rhoTramo(M,num(c.de),num(c.a)):null;
    return`<tr><td><input style="width:64px" inputmode="decimal" data-pzc="${k}" data-pzk="de" value="${fmtg(c.de)}" aria-label="Desde, tramo ${k+1}"></td>

    <td><label style="display:flex;align-items:center;gap:4px;justify-content:center"><input type="checkbox" data-pzc="${k}" data-pzk="agua" ${c.agua?'checked':''} aria-label="Con agua, tramo ${k+1}">💧</label></td>

    <td><button class="btn sm danger" style="flex:none;min-width:40px" data-a="pzBorrarCapa" data-k="${k}" aria-label="Borrar tramo ${k+1}">×</button></td></tr>`}).join('');
  const fs=(k,l,ph)=>`<label class="f">${l}<input inputmode="decimal" data-pz="${k}" value="${fmtg(P[k])}" placeholder="${ph||''}"></label>`;
  return help+`<section class="card" style="display:flex;flex-direction:column;gap:10px">
    <b>Datos del pozo</b>

    <div class="grid2">${fs('dist','Distancia al centro del SEV (m)','0 si está en el centro')}<label class="f">Fecha de perforación<input type="date" data-pz="fecha" value="${esc(P.fecha||'')}"></label></div>
    <div class="grid2">${fs('prof','Profundidad total (m)')}${fs('nivel','Nivel del agua (m)','desde la superficie')}</div>

/* ---- tabla propia: junta todos los pozos con SEV ---- */
function datosCalib(){const g=new Map(),pozos=[];
  for(const s of S.sondeos){const P=s.pozo;if(!P||!P.capas||!P.capas.length||!s.modelo)continue;pozos.push(s);
    for(const c of P.capas){const de=num(c.de),a=num(c.a),r=rhoTramo(s.modelo,de,a);if(r==null||!c.mat)continue;
      const k=normMat(c.mat)+(c.agua?' ·agua':'');if(!g.has(k))g.set(k,{mat:c.mat.trim(),agua:!!c.agua,vals:[],sondeos:new Set()});
      const o=g.get(k);o.vals.push(r);o.sondeos.add(s.nombre)}}
  const grupos=[...g.values()].map(o=>{const v=o.vals.slice().sort((x,y)=>x-y),med=Math.exp(v.reduce((t,x)=>t+Math.log(x),0)/v.length);
    return{...o,n:v.length,min:v[0],max:v[v.length-1],med,sondeos:[...o.sondeos]}}).sort((x,y)=>x.med-y.med);
  return{grupos,pozos}}
function vCalib(){const {grupos,pozos}=datosCalib();
  const help=ayuda(`<ol><li>Aquí se juntan todos los sondeos que tienen <b>pozo de referencia</b> (pestaña <b>Pozo</b> de cada sondeo) y capas calculadas.</li>
    <li>Para cada material del pozo se muestra qué resistividad dio el SEV en ese tramo: mínimo, típico (promedio) y máximo.</li>
    <li>Con 5 a 10 pozos ya tienes una tabla propia de tu región, más confiable que la de los libros. Toca <b>Crear tabla de materiales</b> para usarla al nombrar las capas de los sondeos nuevos.</li>
    <li>💧 marca los tramos donde el pozo encontró agua.</li></ol>`);
  const filas=grupos.map(o=>`<tr><td style="text-align:left">${esc(o.mat)}${o.agua?' 💧':''}</td><td>${o.n}</td><td>${fmt(o.min,o.min<10?1:0)}</td><td><b>${fmt(o.med,o.med<10?1:0)}</b></td><td>${fmt(o.max,o.max<10?1:0)}</td></tr>`).join('');
  const lp=pozos.map(s=>`<button class="item" data-a="pzAbrir" data-id="${s.id}"><div class="main"><b>${esc(s.nombre)}</b><div class="meta">${esc(s.pozo.nombre||'Pozo')} · ${s.pozo.capas.length} tramos${num(s.pozo.ec)>0?` · ${fmtg(s.pozo.ec)} µS/cm`:''}</div></div><div class="val">›</div></button>`).join('');
  return barra('Mi tabla de resistividades',`${pozos.length} pozo(s) de referencia`,true)+`<main>${help}
    ${pozos.length?'':'<div class="note info">Todavía no hay pozos de referencia. Abre un sondeo que tenga capas, ve a la pestaña <b>Pozo</b> y anota la columna del pozo perforado en ese sitio.</div>'}
    ${grupos.length?`<section class="card"><div class="tabla-wrap"><table class="lay"><thead><tr><th>Material</th><th>Tramos</th><th>Mín (Ω·m)</th><th>Típico</th><th>Máx</th></tr></thead><tbody>${filas}</tbody></table></div>
      ${pozos.length<5?`<p class="small muted" style="margin:6px 0 0">Con ${pozos.length} pozo(s) la tabla es todavía una primera idea; se vuelve confiable con 5 a 10.</p>`:''}</section>
      <button class="btn primary" data-a="pzCrearZona">Crear tabla de materiales con estos datos</button>`:''}
    ${lp?`<section class="card"><b>Pozos de referencia</b><div class="list">${lp}</div></section>`:''}</main>`}
function crearZonaCalib(){const {grupos,pozos}=datosCalib();if(!grupos.length)return;
  const r=[];grupos.forEach((o,i)=>{const lo=i===0?0:Math.round(Math.sqrt(grupos[i-1].med*o.med)*10)/10,hi=i===grupos.length-1?1e9:Math.round(Math.sqrt(o.med*grupos[i+1].med)*10)/10;
    r.push({min:lo,max:hi,etq:`${o.mat}${o.agua?' con agua':''} (${o.n} tramo${o.n>1?'s':''} de pozo)`})});
  const z={id:uid(),nombre:`Tabla propia (${pozos.length} pozo${pozos.length>1?'s':''})`,fuente:`Calibración propia con pozos de referencia: ${pozos.map(s=>s.nombre).join(', ')}. Rangos entre los valores típicos de cada material.`,depto:'',rangos:r};
  S.zonas.push(z);saveNow();go({view:'zonas',zonaEd:z.id,desdeSondeo:false});toast('Tabla creada. Revísala y ajusta los nombres si quieres.')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,s=cur();

document.addEventListener('change',e=>{const t=e.target,s=cur();if(!s||!t.dataset)return;

function queSigue(s){if(!s||S.opciones.sinQueSigue||s.ejemplo)return'';

  else{const d=datosInv(s),r=d.length?SEV.rms(d.map(x=>x.rho),SEV.forward(d,s.modelo)):0;
    if(r>10){t=`El modelo se aleja <b>${fmt(r,1)} %</b> de las medidas. Revisa la curva: un punto suelto o un salto en un empalme suele ser la causa. Repite o corrige ese punto y vuelve a Automático.`;b=IR('tab','Ver la curva','data-t="curva"')}
    else{t=`<b>Listo:</b> modelo con error de ${fmt(r,1)} %. Saca el <b>informe</b> en Archivos: allí está <b>Informe completo del estudio</b>, con fotos, conclusiones y recomendaciones.${s.linea?' Este sondeo está en la línea "'+esc(s.linea)+'": míralo en el Perfil 2D.':' Si haces más SEV en la misma línea, ponles Línea y Posición X para el Perfil 2D.'}${s.pozo&&s.pozo.capas&&s.pozo.capas.length?'':' Si se perfora aquí, anota el pozo en la pestaña Pozo.'}`;
      b=IR('tab','Ir a Archivos','data-t="archivos"')+(s.linea?IR('perfil','Ver Perfil 2D'):'')}}
  return`<div class="note info" style="display:flex;flex-direction:column;gap:6px"><div>💡 <b>¿Qué sigue?</b> ${t}</div><div class="row" style="gap:6px;flex-wrap:wrap">${b}</div></div>`}

/** Lee "11.0891, -74.2133" o "11°05'20.7"N 74°12'47.8"W" (también con O de Oeste). */
function leerCoords(t){t=(t||'').replace(/,(?=\d)/g,'.').trim();
  const dms=[...t.matchAll(/(-?\d+(?:\.\d+)?)\s*°\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*["″]?\s*([NSEWO])?/gi)];
  if(dms.length>=2){const v=dms.slice(0,2).map(m=>{let d=Math.abs(+m[1])+(+(m[2]||0))/60+(+(m[3]||0))/3600;const h=(m[4]||'').toUpperCase();if(+m[1]<0||h==='S'||h==='W'||h==='O')d=-d;return d});return{lat:v[0],lon:v[1]}}
  const n=t.match(/-?\d+(?:\.\d+)?/g);if(n&&n.length>=2){const lat=+n[0],lon=+n[1];if(Math.abs(lat)<=90&&Math.abs(lon)<=180)return{lat,lon}}return null}
function gms(v,pos,neg){const a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d)*60-m)*60;return`${d}° ${String(m).padStart(2,'0')}′ ${s.toFixed(1).replace('.',',')}″ ${v<0?neg:pos}`}
const tieneXY=s=>num(s.lat)!=null&&num(s.lon)!=null;
const coordTexto=s=>tieneXY(s)?`${gms(s.lat,'N','S')}, ${gms(s.lon,'E','O')}`:'';
function distM(a,b){return distKm(a.lat,a.lon,b.lat,b.lon)*1000}
function cardCoords(s){const ok=tieneXY(s);
  return`<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>📍 Coordenadas del centro del sondeo</b>
   <p class="small muted" style="margin:0">Toma las coordenadas del centro del sondeo (la estaca entre M y N) con Google Maps o con una app de GPS del celular, y escríbelas o pégalas aquí. En Google Maps: deja el dedo apretado sobre el punto y copia los dos números que aparecen.</p>
   <div class="grid2"><label class="f">Latitud (decimal)<input inputmode="decimal" data-gps="lat" value="${ok?(+s.lat).toFixed(6):''}" placeholder="Ej: 11.089083"></label>
   <label class="f">Longitud (decimal)<input inputmode="decimal" data-gps="lon" value="${ok?(+s.lon).toFixed(6):''}" placeholder="Ej: -74.213306"></label></div>
   <label class="f">O pega las coordenadas juntas<input data-gps="pegar" placeholder="11.089083, -74.213306  ó  11°05'20.7&quot;N 74°12'47.8&quot;W"></label>
   ${(s.depto||s.municipio)?`<div class="small"><b>Sitio:</b> ${esc([s.municipio,s.depto].filter(Boolean).join(', '))}</div>`:''}
   ${ok?`<div class="small">${coordTexto(s)}</div>
   <div class="row"><a class="btn" href="https://www.google.com/maps?q=${(+s.lat).toFixed(6)},${(+s.lon).toFixed(6)}" target="_blank" rel="noopener">Ver en Google Maps</a><button class="btn danger" data-a="gpsBorrar">Borrar coordenadas</button></div>`:''}</section>`}
/** Perfil: posiciones X a partir de las coordenadas (proyección sobre la recta entre los dos SEV más alejados). */
function xDesdeCoords(lin){const ss=S.sondeos.filter(s=>(s.linea||'').trim()===lin&&tieneXY(s));if(ss.length<2)return null;
  let a=ss[0],b=ss[1],dm=0;for(const p of ss)for(const q of ss){const d=distM(p,q);if(d>dm){dm=d;a=p;b=q}}if(dm<1)return null;
  const lat0=a.lat*Math.PI/180,P=s=>({x:(s.lon-a.lon)*111320*Math.cos(lat0),y:(s.lat-a.lat)*110540}),B=P(b),L=Math.hypot(B.x,B.y),u={x:B.x/L,y:B.y/L};
  return ss.map(s=>{const p=P(s);return{s,x:p.x*u.x+p.y*u.y,off:Math.abs(p.x*u.y-p.y*u.x)}}).sort((m,n)=>m.x-n.x)}
function cardXcoords(lin){if(lin==null)return'';const r=xDesdeCoords(lin);if(!r)return'';const x0=r[0].x,fuera=r.filter(o=>o.off>10);
  return`<section class="card" style="display:flex;flex-direction:column;gap:8px"><b>📍 Posiciones según las coordenadas</b>
   <div class="small">${r.map(o=>`${esc(o.s.nombre)}: X ≈ ${fmt(o.x-x0,0)} m${o.s.x!=null?` (anotada ${fmtg(o.s.x)} m)`:''}`).join(' · ')}</div>
   ${fuera.length?`<div class="note warn small">${fuera.map(o=>esc(o.s.nombre)).join(', ')} queda${fuera.length>1?'n':''} a más de 10 m de la línea recta entre los extremos: la línea no está alineada, o hay error en las coordenadas.</div>`:''}
   <p class="small muted" style="margin:0">El GPS del celular tiene un error de 3 a 10 m. Si mediste las distancias con cinta, esas son más exactas.</p>

const FDB={mem:new Map(),db:null,

  async put(id,v){try{await this.tx('readwrite',st=>st.put(v,id))}catch(e){this.mem.set(id,v);if(!this.avisado){this.avisado=1;toast('Este navegador no deja guardar fotos: quedan solo mientras la app esté abierta.')}}},

function capasSEV(s){const M=s.modelo;if(!M)return null;const z=espesores(M),d=datosInv(s);if(!d.length)return null;
  const abmax=Math.max(...d.map(x=>x.ab)),zmax=abmax/2,rms=SEV.rms(d.map(x=>x.rho),SEV.forward(d,M));
  const zon=zonaDe(s),cal=!zon.fija,ar=num(s.ec)>0&&typeof archie==='function'?archie(num(s.ec)):null;
  const L=M.rho.map((r,i)=>{const c={i,r,top:i?z[i-1]:0,bot:i<z.length?z[i]:Infinity,mat:materialDe(s,r)};c.cl=claseCapa(c,cal,ar);return c});
  return{s,M,L,abmax,zmax,rms,n:d.length,cal,ar}}
function claseCapa(c,cal,ar){
  if(c.top<0.5&&c.bot<=3)return'suelo';
  const somero=c.bot<=4.5;
  if(cal){const m=c.mat.toLowerCase();if(/arena|grava|acu[ií]f|saturad|fractur|aluvi/.test(m)&&!/sec[oa]|arcill/.test(m))return'favorable';if(/arcill|limo/.test(m))return'conductor'}
  if(!somero&&ar&&c.r>=ar.min*0.6&&c.r<=ar.max*1.5&&c.r>=8)return'favorable';

  const cv=$('#mkCv'),W=img.naturalWidth,H=img.naturalHeight;cv.width=W;cv.height=H;const g=cv.getContext('2d');

    if(!m){m={sid:act,p:[]};marcas.push(m)}if(m.p.length>=2)m.p=[];m.p.push(p);pinta()};

async function estudioPDF(){if(BUSY)return;const E=estActual(),sevs=sevsDe(E);if(!sevs.length){toast('Elige al menos un sondeo');return}
  BUSY=true;$('#layer').innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="Generando informe"><b>Generando el informe del estudio…</b><div id="progInf" class="small muted" aria-live="polite">Preparando las fotos…</div><div class="progress"><i style="width:100%;opacity:.5"></i></div></div></div>`;
  try{const fotos=[];for(const f of E.fotos){const r=await FDB.get(f.id);const u=r&&(r.ann||r.data);if(!u)continue;fotos.push(Object.assign({},f,{im:{bin:atob(u.split(',')[1]),w:f.w,h:f.h}}))}
    const F=S.opciones.firma,g=(!E.concl||!E.recom)?sugerencias(sevs,E):null;
    const est=Object.assign({},F,{sevs,titulo:E.titulo||'Estudio SEV',cliente:E.cliente||'',fecha:E.fecha,linea:E.linea,intro:E.intro||introAuto(E,sevs),
      concl:E.concl||g.concl,recom:E.recom||g.recom,borrador:E.borrador?'DOCUMENTO DE PRUEBA - BORRADOR':'',fotos,equipo:F.equipo||EQUIPO_DEF,sitio:sitioDe(sevs)});
    if(F.logo&&F.logo.indexOf('data:')===0){try{est.logoImg={bin:atob(F.logo.split(',')[1]),w:F.logow||120,h:F.logoh||80}}catch(e){}}
    const pdf=await informePDF(sevs[0],t=>{const el=$('#progInf');if(el)el.textContent=t},{estudio:est,equiv:S.opciones.equivPDF!==false});
    closeModal();BUSY=false;window._ultimoPDF=pdf;
    guardarArchivo('Informe_'+(est.titulo.replace(/[^\wáéíóúñÁÉÍÓÚÑ\- ]/g,'').trim().replace(/\s+/g,'_')||'estudio')+'.pdf','application/pdf',pdf,'pdf')}
  catch(e){closeModal();BUSY=false;console.error(e);toast('No se pudo crear el PDF: '+e.message)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,E=estActual();
  if(a==='estAbrir'){const s=cur();if(s)abrirEstudio(s);return}
  if(!E)return;
  if(a==='estSug'){const hacer=()=>{const g=sugerencias(sevsDe(E),E);E.concl=g.concl;E.recom=g.recom;saveNow();render();toast('Listo: revísalas y corrígelas')};
    if((E.concl||E.recom))confirmar('¿Reemplazar las conclusiones y recomendaciones que ya escribiste?','Reemplazar',hacer);else hacer();return}
  if(a==='estPDF'){estudioPDF();return}
  if(a==='logoDel'){S.opciones.firma.logo='';S.opciones.firma.logow=S.opciones.firma.logoh=null;saveNow();render();return}
  if(a==='fotoMarcar'){marcarSat(t.dataset.fid);return}
  if(a==='fotoDel'){const id=t.dataset.fid;confirmar('¿Quitar esta foto del estudio?','Quitar',()=>{E.fotos=E.fotos.filter(f=>f.id!==id);FDB.del(id);delete FOTO_URL[id];saveNow();render()});return}});
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset||V.view!=='estudio')return;const E=estActual();if(!E)return;const d=t.dataset;
  if(d.fcat){const files=[...t.files];t.value='';if(!files.length)return;toast('Agregando foto…');
    for(const f of files){try{await agregarFoto(E,d.fcat,f)}catch(err){toast('No se pudo agregar la foto: '+err.message)}}saveNow();render();return}
  if(d.est){E[d.est]=t.value;saveNow();if(d.est==='titulo'||d.est==='fecha')render();return}
  if(d.logo!==undefined){const f=[...t.files];t.value='';if(f.length){try{const r=await comprimir(f[0],420);S.opciones.firma.logo=r.url;S.opciones.firma.logow=r.w;S.opciones.firma.logoh=r.h;saveNow();render();toast('Logo guardado')}catch(err){toast('No se pudo leer el logo: '+err.message)}}return}
  if(d.firma){S.opciones.firma[d.firma]=t.value;saveNow();return}
  if(d.estchk){E[d.estchk]=t.checked;saveNow();return}
  if(d.fdesc){const f=E.fotos.find(x=>x.id===d.fdesc);if(f){f.desc=t.value;saveNow()}return}
  if(d.rumbo){const s=S.sondeos.find(x=>x.id===d.rumbo);if(s){const v=t.value.trim()===''?null:num(t.value);s.rumbo=v==null?null:((v%360)+360)%360;saveNow()}return}
  if(d.estsev){if(t.checked){if(!E.sevs.includes(d.estsev))E.sevs.push(d.estsev)}else E.sevs=E.sevs.filter(x=>x!==d.estsev);saveNow();render();return}});

function importarZonaGeo(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('El archivo de zona no es válido');return}
  const arr=Array.isArray(d)?d:(d.zonasGeo||d.zonas||(d.id?[d]:null));
  if(!arr||!arr.length){toast('El archivo no trae zonas geológicas');return}
  S.zonasGeo=Array.isArray(S.zonasGeo)?S.zonasGeo:[];let n=0;
  for(const z of arr){if(!z||!z.id||!z.n||!Array.isArray(z.bbox)||z.bbox.length!==4){continue}
    const i=S.zonasGeo.findIndex(x=>x.id===z.id);const limp={id:String(z.id),n:String(z.n),dep:Array.isArray(z.dep)?z.dep.map(String):[],bbox:z.bbox.map(Number),pl:z.pl?String(z.pl):'',geo:String(z.geo||''),agua:String(z.agua||''),fuente:z.fuente?String(z.fuente):'',imgData:typeof z.imgData==='string'&&z.imgData.indexOf('data:')===0?z.imgData:'',imgPie:z.imgPie?String(z.imgPie):''};
    if(i>=0)S.zonasGeo[i]=limp;else S.zonasGeo.push(limp);n++}
  if(!n){toast('Las zonas del archivo no tienen el formato correcto');return}
  saveNow();render();toast(n+' zona(s) geológica(s) cargada(s)')}

  if(t.dataset.a==='borrarZonasGeo'){if(!(S.zonasGeo&&S.zonasGeo.length)){toast('No hay zonas importadas');return}confirmar('¿Borrar las zonas geológicas que importaste? (Las de la región Caribe se quedan.)','Borrar',()=>{S.zonasGeo=[];saveNow();render()});return}});

/* ---------- geología del SGC en vivo por coordenadas (necesita señal) ---------- */
const SGC_BASE='https://srvags.sgc.gov.co/arcgis/rest/services/Mapa_Geologico_Colombia_2015/Mapa_Geologico_Colombia_2015/MapServer';
function sgcBbox(lat,lon){const dlon=0.12,dlat=0.11;return[lon-dlon,lat-dlat,lon+dlon,lat+dlat]}
function sgcMapaURL(lat,lon,w,h){const b=sgcBbox(lat,lon);return `${SGC_BASE}/export?bbox=${b.join(',')}&bboxSR=4686&imageSR=4686&size=${w},${h}&format=png&transparent=false&dpi=96&f=image`}
function sgcIdent(lat,lon){return new Promise((ok,ko)=>{const b=sgcBbox(lat,lon),cb='_sgc'+Math.random().toString(36).slice(2),sc=document.createElement('script');
  const limpiar=()=>{try{delete window[cb]}catch(e){window[cb]=null}sc.remove();clearTimeout(t)};
  const t=setTimeout(()=>{limpiar();ko(new Error('timeout'))},20000);
  window[cb]=d=>{limpiar();ok(d)};sc.onerror=()=>{limpiar();ko(new Error('red'))};
  sc.src=`${SGC_BASE}/identify?geometry=${encodeURIComponent(JSON.stringify({x:lon,y:lat}))}&geometryType=esriGeometryPoint&sr=4686&layers=all&tolerance=3&mapExtent=${b.join(',')}&imageDisplay=1000,916,96&returnGeometry=false&f=json&callback=${cb}`;
  document.body.appendChild(sc)})}
function parseSGC(d){const rs=(d&&d.results)||[],buscar=(frag)=>rs.find(r=>(r.layerName||'').toLowerCase().includes(frag));
  const g=buscar('cronoestrat')||buscar('geolog'),adm=buscar('administrativ')||buscar('municip');
  const at=g?g.attributes||{}:{},val=(frag)=>{const k=Object.keys(at).find(k=>k.toLowerCase().replace(/[íó]/g,m=>({'í':'i','ó':'o'}[m])).includes(frag));return k?String(at[k]).trim():''};
  const muni=adm?(()=>{const a=adm.attributes||{},k=Object.keys(a).find(k=>['nmg','nombre','municipio'].includes(k.toLowerCase()));return k?String(a[k]).trim():''})():'';
  return{sym:val('mbolo')||val('simbolo'),desc:val('escrip'),edad:val('edad'),form:val('integ')||val('unidad'),muni:muni}}
function marcarCentro(url){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);const cx=im.width/2,cy=im.height/2,rad=Math.max(12,im.width/50),lw=Math.max(2,im.width/280);
  g.lineWidth=lw*2.2;g.strokeStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(cx,cy,rad,0,7);g.stroke();g.beginPath();g.moveTo(cx-rad*1.8,cy);g.lineTo(cx+rad*1.8,cy);g.moveTo(cx,cy-rad*1.8);g.lineTo(cx,cy+rad*1.8);g.stroke();
  g.lineWidth=lw;g.strokeStyle='#c00000';g.beginPath();g.arc(cx,cy,rad,0,7);g.stroke();g.beginPath();g.moveTo(cx-rad*1.8,cy);g.lineTo(cx+rad*1.8,cy);g.moveTo(cx,cy-rad*1.8);g.lineTo(cx,cy+rad*1.8);g.stroke();
  g.fillStyle='#c00000';g.beginPath();g.arc(cx,cy,lw*1.6,0,7);g.fill();ok(c.toDataURL('image/jpeg',0.85))}catch(e){ok(url)}};im.onerror=()=>ok(url);im.src=url})}
async function buscarGeoSGC(s){if(!tieneXY(s)){toast('Primero pon las coordenadas del sondeo');return}
  if(navigator.onLine===false){toast('Necesitas señal (internet) para traer la geología del SGC');return}
  V.sgcCargando=s.id;render();
  try{const d=await sgcIdent(+s.lat,+s.lon),p=parseSGC(d);
    const g={sym:p.sym,desc:p.desc,edad:p.edad,form:p.form,muni:p.muni,fecha:new Date().toLocaleDateString('es-CO'),lat:+s.lat,lon:+s.lon};
    // intento de guardar el mapa (puede fallar según el navegador: no es crítico)
    try{const r=await fetch(sgcMapaURL(+s.lat,+s.lon,1000,916));if(r.ok){const bl=await r.blob();g.imw=1000;g.imh=916;const u0=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=ko;fr.readAsDataURL(bl)});g.img=await marcarCentro(u0)}}catch(e){g.img=''}
    s.geoSGC=g;autoSitio(s,p.muni);V.sgcCargando=null;saveNow();render();
    toast(p.sym?('SGC: '+p.sym+(p.form?' · '+p.form:'')):'El SGC respondió, pero sin unidad en ese punto (¿mar o fuera de Colombia?)')}
  catch(e){V.sgcCargando=null;render();toast('No se pudo conectar al SGC. Revisa la señal e intenta otra vez.')}}
function cardGeoSGC(s){if(!tieneXY(s))return '';const g=s.geoSGC,cargando=V.sgcCargando===s.id;
  return `<section class="card" style="display:flex;flex-direction:column;gap:8px"><b>🌐 Geología oficial del SGC en este punto</b>
   <p class="small muted" style="margin:0">Con señal, trae del Servicio Geológico la unidad exacta de estas coordenadas y su mapa. Hazlo en la casa antes de viajar: queda guardado para el informe.</p>
   <button class="btn ${g?'':'primary'}" data-a="sgcBuscar" ${cargando?'disabled':''}>${cargando?'Consultando al SGC…':(g?'Actualizar desde el SGC':'🌐 Traer geología del SGC')}</button>
   ${g?`<div class="small" style="display:flex;flex-direction:column;gap:3px">
     ${g.sym?`<div><b>Unidad:</b> ${esc(g.sym)}${g.form?' — '+esc(g.form):''}</div>`:'<div class="muted">El SGC no reporta unidad en el punto exacto (puede ser mar, depósito reciente sin símbolo, o fuera del mapa).</div>'}

     ${g.edad?`<div><b>Edad:</b> ${esc(g.edad)}</div>`:''}
     ${g.muni?`<div><b>Municipio:</b> ${esc(g.muni)}</div>`:''}
     <div class="muted">Fuente: SGC, Mapa Geológico de Colombia 2015. Consultado ${esc(g.fecha||'')}.</div></div>
    ${g.img?`<img src="${g.img}" alt="Mapa SGC" style="width:100%;border-radius:8px;border:1px solid var(--line,#dde3df)"><div class="small muted">Recorte del mapa del SGC centrado en el punto. El sondeo está en el centro.</div>`
      :`<div class="note info small">Guardé los datos de la unidad. El mapa no se pudo guardar en este navegador; para verlo abre: <a href="${sgcMapaURL(+s.lat,+s.lon,1000,916)}" target="_blank" rel="noopener">mapa del SGC</a> (necesita señal). Si quieres el mapa en el informe, pídemelo y te lo dejo embebido.</div>`}
    <button class="btn danger" data-a="sgcBorrar">Borrar</button>`:''}
   </section>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const s=cur();if(!s)return;

  else if(/\d,\d/.test(l)&&l.includes('.'))c=l.split(',');
