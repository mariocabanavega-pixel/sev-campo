  const s=cur(),ed=V.zonaEd?zonas().find(z=>z.id===V.zonaEd):null;
  if(ed){const fija=!!ed.fija;
    const filas=ed.rangos.map((g,k)=>`<tr><td><input inputmode="decimal" data-zr="${k}" data-zk="min" value="${fmtg(g.min)}" ${fija?'disabled':''} aria-label="Mínimo fila ${k+1}"></td>
      <td><input inputmode="decimal" data-zr="${k}" data-zk="max" value="${g.max>=1e9?'':fmtg(g.max)}" placeholder="sin límite" ${fija?'disabled':''} aria-label="Máximo fila ${k+1}"></td>
      <td style="text-align:left"><input style="text-align:left;font-family:var(--font)" data-zr="${k}" data-zk="etq" value="${esc(g.etq)}" ${fija?'disabled':''} aria-label="Material fila ${k+1}"></td>
      <td>${fija?'':`<button class="btn sm danger" style="flex:none;min-width:40px" data-a="zrBorrar" data-k="${k}" aria-label="Borrar fila ${k+1}">×</button>`}</td></tr>`).join('');
    return barra(ed.nombre,fija?'Tabla de referencia (solo lectura)':'Tabla de materiales',true)+`<main>
    ${ayuda(`<ol><li>Cada fila asigna un material a un rango de resistividad (de mínimo a máximo, en Ω·m). Se revisan en orden y gana la primera que coincida.</li>
      <li>La mejor forma de llenarla es con un <b>pozo de referencia</b>: haz un SEV junto a un pozo con su columna de materiales descrita y anota qué resistividad dio cada material.</li>
      <li>Escribe en <b>Fuente</b> de dónde salen los valores (pozo, estudio de la autoridad ambiental, SGC…): aparece en el informe.</li>
      <li><b>Departamento</b>: la app te sugiere esta tabla en los sondeos de ese departamento.</li></ol>`)}
    ${fija?'<div class="note info small">Esta tabla general es la referencia de los libros; no se edita. Toca <b>Duplicar</b> para crear tu propia versión.</div>':''}
    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <label class="f">Nombre<input data-zc="nombre" value="${esc(ed.nombre)}" ${fija?'disabled':''}></label>
      <label class="f">Fuente de los valores<textarea data-zc="fuente" style="font-family:var(--font);font-size:14px;min-height:70px" ${fija?'disabled':''}>${esc(ed.fuente||'')}</textarea></label>
      ${fija?'':`<label class="f">Departamento donde aplica<select data-zc="depto"><option value="">— Cualquiera —</option>${Object.keys(DEPTOS).sort((a,b)=>a.localeCompare(b,'es')).map(k=>`<option${k===ed.depto?' selected':''}>${esc(k)}</option>`).join('')}</select></label>`}
      <div class="tabla-wrap"><table class="lay"><thead><tr><th>Desde (Ω·m)</th><th>Hasta (Ω·m)</th><th>Material</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
      ${fija?'':'<button class="btn" data-a="zrAgregar">+ Agregar fila</button>'}
      <div class="row"><button class="btn" data-a="zDuplicar">Duplicar</button>${fija?'':'<button class="btn danger" data-a="zBorrar">Borrar tabla</button>'}</div></section></main>`}
  const items=zonas().map(z=>{const usos=S.sondeos.filter(x=>(x.zonaId||'general')===z.id).length;
    return `<button class="item" data-a="zEditar" data-id="${z.id}"><div class="main"><b>${esc(z.nombre)}</b><div class="meta">${z.rangos.length} rangos · usada en ${usos} sondeo(s)${z.depto?` · ${esc(z.depto)}`:''}</div></div><div class="val">›</div></button>`}).join('');
  return barra('Tablas de materiales','Calibración por zona',true)+`<main>
    ${ayuda(`<p>La resistividad de un mismo material cambia de una zona a otra (sobre todo por la salinidad del agua), así que conviene una tabla por zona, calibrada con pozos o con la conductividad del agua local. La tabla <b>General</b> es solo la referencia amplia de los libros.</p>`)}
    <button class="btn primary" data-a="zNueva">+ Nueva tabla${s?' a partir de este sondeo':''}</button>
    <section class="card"><div class="list">${items}</div></section></main>`}
function accionZonas(a,t){const s=cur();
  if(a==='zonas'){go({view:'zonas',zonaEd:null,desdeSondeo:!!s});return}
  if(a==='zEditar'){go({zonaEd:t.dataset.id});return}
  if(a==='zNueva'){const z=s?nuevaZonaDesde(s):{id:uid(),nombre:'Nueva zona',fuente:'',depto:'',rangos:clone(ZONA_GENERAL.rangos)};S.zonas.push(z);saveNow();go({zonaEd:z.id});return}
  if(a==='crearZona'){const z=nuevaZonaDesde(s);S.zonas.push(z);s.zonaId=z.id;saveNow();go({view:'zonas',zonaEd:z.id,desdeSondeo:true});toast('Tabla creada con el agua de la zona. Revísala y anota la fuente.');return}
  if(a==='usarZona'){s.zonaId=t.dataset.id;saveNow();render();toast('Tabla asignada');return}
  const z=S.zonas.find(x=>x.id===V.zonaEd);
  if(a==='zDuplicar'){const o=zonas().find(x=>x.id===V.zonaEd),c=clone(o);c.id=uid();c.nombre=o.nombre+' (copia)';delete c.fija;if(c.depto===undefined)c.depto='';S.zonas.push(c);saveNow();go({zonaEd:c.id});return}
  if(!z)return;
  if(a==='zrAgregar'){const u=z.rangos[z.rangos.length-1];z.rangos.push({min:u?Math.min(u.max,1e6):0,max:1e9,etq:'Nuevo material'});saveNow();render();return}
  if(a==='zrBorrar'){z.rangos.splice(+t.dataset.k,1);saveNow();render();return}
  if(a==='zBorrar'){confirmar(`¿Borrar la tabla "${z.nombre}"? Los sondeos que la usan pasarán a la General.`,'Borrar',()=>{S.zonas=S.zonas.filter(x=>x.id!==z.id);for(const x of S.sondeos)if(x.zonaId===z.id)x.zonaId='general';saveNow();go({zonaEd:null})});return}}

/* ---------- utilidades UI ---------- */
let toastT;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3000)}
function confirmar(texto,ok,cb){$('#layer').innerHTML=`<div class="modal" data-a="cerrar"><div class="card" role="dialog" aria-modal="true"><b>${esc(texto)}</b>
  <div class="row"><button class="btn" data-a="cerrar">Cancelar</button><button class="btn danger" data-a="okModal">${esc(ok)}</button></div></div></div>`;
  window._ok=cb;setTimeout(()=>$('.modal .btn')?.focus(),0)}
function closeModal(){$('#layer').innerHTML='';window._ok=null}
function copiarTexto(txt,ta){const done=()=>toast('Copiado. Pégalo en el Bloc de notas, un correo o WhatsApp.');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{if(ta){ta.select();toast('Selecciona y copia el texto')}});
  else if(ta){ta.select();try{document.execCommand('copy');done()}catch(_){toast('Selecciona y copia el texto')}}}

function render(){
  const html={lista:vLista,editar:vEditar,sondeo:vSondeo,medida:vMedida,importar:vImportar,perfil:vPerfil,zonas:vZonas,calib:vCalib,guia:vGuia,estudio:vEstudio,pasos:vPasos}[V.view]();$('#app').innerHTML=html;
  if(V.view==='medida'){actualizarRes();const s=cur(),first=s.modo==='r'?$('#inR'):s.modo==='rho'?$('#inRHO'):$('#inI');if(first&&!first.value)first.focus({preventScroll:true})}
  if(V.view==='sondeo'&&V.tab==='capas'&&cur()&&cur().modelo&&!RESTORE[V.sid])RESTORE[V.sid]=clone(cur().modelo)}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='cerrar'){if(e.target===t)closeModal();return}
  if(a==='okModal'){const cb=window._ok;closeModal();cb&&cb();return}
  const s=cur();
  switch(a){
    case 'back':window.sevBack();break;
    case 'guardarEd':guardarEd();break;
    case 'nuevo':go({view:'editar',nuevo:true});break;
    case 'importar':go({view:'importar',impTarget:null,imp:null});break;
    case 'importarAqui':go({view:'importar',impTarget:s.id,imp:null});break;
    case 'perfil':go({view:'perfil'});break;
    case 'eje':go({eje:t.dataset.v});break;
    case 'pLinea':go({linea:t.dataset.v});break;
    case 'pVista':go({pvista:t.dataset.v});break;
    case 'pPDF':{const lin=V.linea==='__todas'?null:V.linea;perfilPDF(lin).then(pdf=>guardarArchivo('Perfil_'+(lin==null?'todos':(lin||'sin_linea')).replace(/[^\w\-]/g,'_')+'.pdf','application/pdf',pdf,'pdf')).catch(e=>toast('No se pudo crear el PDF: '+e.message));break}
    case 'respaldo':respaldo();break;
    case 'abrir':go({view:'sondeo',sid:t.dataset.id,tab:'medidas',nuevo:false,sel:0,eq:null,editMed:false,volverLista:false});break;
    case 'editar':go({view:'editar',nuevo:false});break;
    case 'tab':go({tab:t.dataset.t});break;
    case 'medida':go({view:'medida',idx:+t.dataset.i});break;
    case 'agregar':{const u=s.filas[s.filas.length-1];s.filas.push(fila({ab:u?+(num(u.ab)*1.5).toPrecision(2):1,mn:u?num(u.mn):0.5}));save();go({view:'medida',idx:s.filas.length-1});break}
    case 'prev':saveNow();go({idx:Math.max(0,V.idx-1)});break;
    case 'leerEquipo':leerEquipo();break;
    case 'next':saveNow();if(V.idx<s.filas.length-1)go({idx:V.idx+1});else{go({view:'sondeo',tab:'curva'});toast('Medidas completas. Esta es tu curva.')}break;
    case 'borrarMedida':confirmar(`¿Borrar la medida ${V.idx+1} (AB/2 ${fmtg(s.filas[V.idx].ab)} m)?`,'Borrar',()=>{s.filas.splice(V.idx,1);saveNow();go({view:'sondeo',tab:'medidas'})});break;
    case 'borrarSondeo':confirmar(`¿Borrar el sondeo "${s.nombre}" con todas sus medidas? No se puede deshacer.`,'Borrar sondeo',()=>{S.sondeos=S.sondeos.filter(x=>x.id!==s.id);saveNow();go({view:'lista',sid:null,volverLista:false});toast('Sondeo borrado')});break;
    case 'exp':exportar(t.dataset.f);break;
    case 'gArch':accionArchivo(t.dataset.m);break;
    case 'cerrarArch':if(e.target===t)cerrarArch();break;
    case 'copiar':copiarTexto($('#expTxt').value,$('#expTxt'));break;
    case 'moverM':case 'insertarM':case 'borrarM':case 'ordenarAB':accionMedidas(a,t);break;
    case 'editMed':V.editMed=!V.editMed;render();break;
    case 'editLista':V.editLista=!V.editLista;render();break;
    case 'moverS':{const k=S.sondeos.findIndex(x=>x.id===t.dataset.id),j=k+(+t.dataset.d);if(j>=0&&j<S.sondeos.length){[S.sondeos[k],S.sondeos[j]]=[S.sondeos[j],S.sondeos[k]];saveNow();render()}break}
    case 'editarS':go({view:'editar',nuevo:false,sid:t.dataset.id,volverLista:true});break;
    case 'duplicarS':{const o=S.sondeos.find(x=>x.id===t.dataset.id);const c=clone(o);c.id=uid();c.nombre=o.nombre+' (copia)';c.ejemplo=false;S.sondeos.splice(S.sondeos.indexOf(o)+1,0,c);saveNow();render();toast('Sondeo duplicado');break}
    case 'borrarS':{const o=S.sondeos.find(x=>x.id===t.dataset.id);confirmar(`¿Borrar el sondeo "${o.nombre}" con todas sus medidas y capas? No se puede deshacer.`,'Borrar sondeo',()=>{S.sondeos=S.sondeos.filter(x=>x.id!==o.id);saveNow();render();toast('Sondeo borrado')});break}
    case 'pt':{const idx=+t.dataset.i,f=s.filas[idx],el=$('#pt');if(el)el.innerHTML=`<b>Medida ${idx+1}:</b> AB/2 = ${fmtg(f.ab)} m · MN = ${fmtg(f.mn)} m · ρa = <b>${fmt(rho(s,f))} Ω·m</b>${f.off?' <span class="chip" style="background:var(--line);color:var(--muted)">sin usar</span>':''} <button class="btn sm ${f.off?'':'danger'}" data-a="toggleOff" data-i="${idx}" style="margin-left:4px;min-height:0;padding:4px 10px">${f.off?'Volver a usar':'No usar'}</button>`;break}
    case 'toggleOff':{const f=s&&s.filas[+t.dataset.i];if(f){f.off=!f.off;saveNow();render();toast(f.off?'Punto apagado. Vuelve a Capas y toca Automático para afinar el modelo.':'Punto activado otra vez. Recalcula las capas (Automático).')}break}
    case 'sel':V.sel=+t.dataset.l;render();break;
    case 'auto':case 'dos':case 'invertir':case 'dividir':case 'unir':case 'rango':case 'fijar':case 'deshacer':case 'restaurar':accionCapas(a,t);break;
    case 'copiar-modelo':copiarModelo();break;
    case 'zonasLista':go({view:'zonas',zonaEd:null,desdeSondeo:false,sid:null});break;
    case 'zonas':case 'zEditar':case 'zNueva':case 'crearZona':case 'usarZona':case 'zDuplicar':case 'zrAgregar':case 'zrBorrar':case 'zBorrar':accionZonas(a,t);break;
    case 'ipiAdd':case 'ipiDel':case 'ipiDesdeApp':case 'ipiUsar':case 'ipiBorrar':case 'ipiPegar':accionIpi(a);break;
    case 'pegar':pegarModelo();break;
    case 'borrarModelo':confirmar('¿Borrar el modelo de capas de este sondeo?','Borrar',()=>{pushUndo(s);delete s.modelo;V.eq=null;saveNow();render()});break;
    case 'impLeer':{V.impTexto=$('#impText').value;V.imp=leerImport(V.impTexto,'');render();break}
    case 'impCrear':crearDesdeImport();break;
    case 'impRespaldo':importarRespaldo();break;
    case 'cargarEstudios':cargarEstudios();break;
    case 'plantilla':guardarArchivo('Plantilla_SEV.txt','text/plain','﻿'+PLANTILLA.replace(/\n/g,'\r\n'),'txt');break;
    case 'copiarPlantilla':copiarTexto(PLANTILLA,null);break;
  }});
document.addEventListener('input',e=>{
  if(V.view!=='medida')return;const f=cur().filas[V.idx],id=e.target.id,v=e.target.value.trim();
  const map={inAB:'ab',inMN:'mn',inI:'i',inD1:'dv1',inD2:'dv2',inSP:'sp',inR:'r',inRHO:'rhoa',inNota:'nota'};if(!map[id])return;
  f[map[id]]=id==='inNota'?v:(v===''?null:num(v));save();actualizarRes()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files&&t.files[0]){const file=t.files[0],rd=new FileReader();
    rd.onload=()=>{V.imp=leerImport(String(rd.result),file.name);render()};rd.onerror=()=>toast('No se pudo leer el archivo');rd.readAsText(file);return}
  if(t.dataset&&(t.dataset.ipil!=null||t.dataset.ipirms)){const s=cur();s.ipi=s.ipi||{rho:[],h:[],rms:null};
    if(t.dataset.ipirms){s.ipi.rms=num(t.value);saveNow();render();return}
    const v=num(t.value);if(!(v>0)){toast('Escribe un número mayor que cero');render();return}
    s.ipi[t.dataset.ipik==='rho'?'rho':'h'][+t.dataset.ipil]=v;saveNow();render();return}
  if(t.dataset&&t.dataset.ubic){const s=cur(),k=t.dataset.ubic;
    if(k==='municipio'||k==='municipioTxt'){const v=t.value.trim();if(k==='municipio'||v)s.municipio=v;saveNow();render();return}
    if(k==='ec'){const v=num(t.value);s.ec=v>0?v:null}else if(k==='depto'){if(s.depto!==t.value)s.municipio='';s.depto=t.value}else s[k]=t.value||(k==='zonaId'?'general':'');
    saveNow();render();return}
  if(t.dataset&&t.dataset.zc){const z=S.zonas.find(x=>x.id===V.zonaEd);if(!z)return;const k=t.dataset.zc;
    z[k]=t.value.trim();saveNow();if(k!=='fuente')render();return}
  if(t.dataset&&t.dataset.zr!=null){const z=S.zonas.find(x=>x.id===V.zonaEd);if(!z)return;const g=z.rangos[+t.dataset.zr],k=t.dataset.zk;
    if(k==='etq')g.etq=t.value.trim()||'Sin nombre';else{const v=t.value.trim()===''&&k==='max'?1e9:num(t.value);if(v==null||v<0){toast('Escribe un número');render();return}g[k]=v}
    if(g.max<=g.min)toast('Ojo: en esa fila el "hasta" debe ser mayor que el "desde".');saveNow();render();return}
  if(t.dataset&&t.dataset.opchk){S.opciones[t.dataset.opchk]=t.checked;saveNow();return}
  if(t.dataset&&t.dataset.op){const v=num(t.value);if(v>0){S.opciones[t.dataset.op]=t.dataset.op==='maxN'?Math.max(2,Math.min(8,Math.round(v))):v;saveNow()}return}
  if(V.view!=='sondeo'||V.tab!=='capas'||!t.dataset||t.dataset.l==null)return;
  const s=cur(),M=s.modelo;if(!M)return;const i=+t.dataset.l,k=t.dataset.k;
  const v=num(t.value);if(!(v>0)){toast('Escribe un número mayor que cero');render();return}
  pushUndo(s);if(k==='rho')M.rho[i]=Math.min(1e5,Math.max(0.1,v));else M.h[i]=Math.min(2000,Math.max(0.1,v));
  V.sel=i;V.eq=null;saveNow();render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&V.view==='medida'&&e.target.tagName==='INPUT'){e.preventDefault();
    const ins=[...document.querySelectorAll('main input')];const k=ins.indexOf(e.target);
    if(k>=0&&k<ins.length-1&&e.target.id!=='inNota')ins[k+1].focus();else $('[data-a="next"]').click();return}
  if(e.key==='Enter'&&V.view==='editar'&&e.target.tagName==='INPUT'){e.preventDefault();guardarEd();return}
  if(e.key==='Escape'){window.sevBack();return}
  if(V.view==='sondeo'&&V.tab==='capas'&&cur()&&!BUSY){const enCampo=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);const M=cur().modelo;
    const hacer=(a,ds={})=>{e.preventDefault();accionCapas(a,{dataset:ds})};
    if(e.key==='F7'&&e.ctrlKey)return hacer('restaurar');
    if(e.key==='F7')return hacer('auto');
    if(!M||enCampo)return;
    if(e.key===' ')return hacer('invertir');
    if(e.ctrlKey&&(e.key==='n'||e.key==='N'))return hacer('dividir');
    if(e.ctrlKey&&(e.key==='y'||e.key==='Y'))return hacer('unir');
    if(e.altKey&&e.key==='Backspace')return hacer('deshacer');
    if(e.key==='ArrowDown'){e.preventDefault();V.sel=Math.min(M.rho.length-1,V.sel+1);render()}
    if(e.key==='ArrowUp'){e.preventDefault();V.sel=Math.max(0,V.sel-1);render()}}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fEd')guardarEd()});
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
render();

/* ---------- instalación como app (solo cuando se abre desde https) ---------- */
(function(){const segura=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!segura||enMarco)return;
  const ln=(rel,href,extra)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(extra)Object.assign(l,extra);document.head.appendChild(l)};
  ln('manifest','manifest.webmanifest');ln('apple-touch-icon','icon-192.png');
  const m=document.createElement('meta');m.name='theme-color';m.content='#0B6E5F';document.head.appendChild(m);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))})();

</script>
